<!DOCTYPE html>
<html lang="en" class="h-full w-full bg-[#090d16] text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A mindful pass-and-play conversational intimacy web application." />

  <title>Skipstone</title>

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-11/12 max-w-sm"></div>

  <script type="module" src="/src/main.ts"></script>
