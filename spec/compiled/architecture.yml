    target_id: system_skipstone
  - data_type: ephemeral_session_cache
    target_id: system_skipstone
  edges:
    depends_on:
    - module_prompt_catalogs
    implements:
    - system_skipstone
- id: module_ui_shell
  dimension: Module
  status: clean
  associated_file: src/ui/views/SplitGameView.ts
  description: Modular responsive UI views including dual-zone SplitGameView (speaker
    reading zone with role/mutual badges and active listener coaching zone), BriefingView
