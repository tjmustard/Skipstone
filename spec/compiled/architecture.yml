    1MB file limit, custom_ ID namespacing, prompt field bounds, validation error
    reporting, and optional bilateral role metadata (isBilateral, roleA, roleB, roleLabels,
    targetRole) with backward-compatibility for custom deck imports/exports and IndexedDB
    persistence
  inputs:
  - data_type: custom_deck_file_selection
    source_id: module_ui_shell
  - data_type: prompt_schema_types
    source_id: module_prompt_catalogs
