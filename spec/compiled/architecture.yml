- id: module_core_engine
  dimension: Module
  status: clean
  associated_file: src/core/state.ts
  description: Finite state machine orchestrating reactive app state (DECK_SELECT,
    BRIEFING, IN_SESSION, PROGRESSION_MODAL, GROUNDING_CHECKOUT), role-partitioned
