    target_id: module_core_engine
  - data_type: persisted_custom_decks
    target_id: system_skipstone
  - data_type: custom_deck_export_blob
    target_id: system_skipstone
  edges:
    depends_on:
    - module_ui_shell
    - module_core_engine
    - module_prompt_catalogs
    implements:
    - system_skipstone
